# 저장소 루트에서 RPA·debug 테스트를 돌리기 위한 설정.
# 테스트 파일/클래스 이름이 프로젝트 컨벤션(camelCase, .agentfiles/naming.md)을 따르는데
# pytest 기본 탐색 패턴은 test_*.py / Test* 클래스라 그대로 두면 "no tests ran"이 된다.
# 백엔드 테스트는 `schemas` 등을 최상위로 import하므로 WebApps/backend에서 별도로 돌린다
# (그쪽 WebApps/backend/pytest.ini 참고).
# debug/db의 testCrud.py/testDbConnection.py는 pytest 테스트가 아니라 손으로 돌리는
# MongoDB 스크립트다 — 이름이 test*.py라 패턴에 걸리므로 testpaths에서 제외한다.
[pytest]
testpaths = RPAs debug/detection
python_files = test*.py
python_classes = *Test *Tests Test*
python_functions = test*
