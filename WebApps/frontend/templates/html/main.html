<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 수거 / 관리 시스템</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <div class="app-container">
        <!-- [좌측 사이드바가 들어갈 위치] -->
        <div id="sidebar-container"></div>

        <!-- [우측 메인 콘텐츠] -->
        <main class="main-content">
            <div class="content-header">
                <h1 id="contentTitle">현재 상태: 수거 모드</h1>
                <span id="modeBadge" class="badge badge-collect">수거 가동 중</span>
            </div>

            <div class="content-body" id="contentBody">
                <h2>실시간 모니터링 (ELEV-01)</h2>
                <div class="video-container" id="videoContainer">
                    <button id="fullscreenBtn" class="fullscreen-btn" title="전체화면 토글">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                    <div class="video-placeholder">
                        <img src="images/video_placeholder.jpg" alt="실시간 CCTV 화면">
                        <!-- <h2>실시간 디택팅 스트리밍 화면</h2>
                        <p class="status-text">CCTV 카메라 연결됨 (MJPEG)</p> -->
                    </div>
                </div>
                <div class="control-panel">
                    <button id="testAlertBtn" class="test-btn">
                        <i class="fa-solid fa-triangle-exclamation"></i> 오배출 경고 테스트 (5초)
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- 외부 JS 연결 (sidebar.js를 먼저 불러옵니다) -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
