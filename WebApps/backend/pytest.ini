# 테스트 파일/클래스 이름이 프로젝트 컨벤션(camelCase, .agentfiles/naming.md)을 따르는데
# pytest 기본 탐색 패턴은 test_*.py / Test* 클래스라 그대로 두면 "no tests ran"이 된다.
# 실제 이름(testEventService.py, EventServiceTest)에 맞춰 탐색 규칙을 재정의한다.
[pytest]
testpaths = tests
python_files = test*.py
python_classes = *Test *Tests Test*
python_functions = test*
