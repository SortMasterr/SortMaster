<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>스마트 수거 / 관리 시스템</title>

    <!-- Font Awesome 아이콘 -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- 메인 페이지 CSS -->
    <link
        rel="stylesheet"
        href="/static/css/index.css?v=10"
    >

    <!-- 공통 사이드바 CSS -->
    <link
        rel="stylesheet"
        href="/static/css/sidebar.css?v=9"
    >
</head>

<body>
    <div class="appContainer">
        <!-- 사이드바 -->
        <div id="sidebarContainer">
            {% include "sidebar.html" %}
        </div>

        <!-- 우측 메인 콘텐츠 -->
        <main class="mainContent">
            <div class="contentHeader">
                <h1 id="contentTitle">
                    현재 상태: 수거 모드
                </h1>

                <span
                    id="modeBadge"
                    class="badge badgeCollect"
                >
                    수거 가동 중
                </span>
            </div>

            <div
                class="contentBody"
                id="contentBody"
            >
                <h2>실시간 모니터링</h2>

                <div
                    class="videoContainer"
                    id="videoContainer"
                >
                    <!-- 두 카메라 전체 확대 버튼 -->
                    <button
                        id="fullscreenBtn"
                        class="fullscreenBtn"
                        title="두 카메라 전체화면 보기"
                        aria-label="두 카메라 전체화면 보기"
                        type="button"
                    >
                        <i class="fa-solid fa-expand"></i>
                    </button>

                    <div class="videoSplit">
                        {% for id in cameraIds %}
                        <div
                            class="videoPane"
                            data-camera-id="{{ id }}"
                            tabindex="0"
                            role="button"
                            title="{{ id }} 카메라 전체화면 보기"
                            aria-label="{{ id }} 카메라 전체화면 보기"
                        >
                            <span class="videoPaneLabel">
                                {{ id }}
                            </span>

                            <img
                                src="/api/stream/{{ id }}"
                                alt="{{ id }} 카메라 실시간 화면"
                            >
                        </div>
                        {% endfor %}
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- 공통 JS를 먼저 불러옵니다. -->
    <script src="/static/js/sidebar.js?v=12"></script>
    <script src="/static/js/index.js?v=11"></script>
</body>

</html>
