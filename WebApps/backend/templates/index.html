<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>스마트 수거 / 관리 시스템</title>

    <!-- Font Awesome 아이콘 -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- 메인 페이지 CSS -->
    <link rel="stylesheet" href="../static/css/index.css">

    <!-- 공통 사이드바 CSS: main.css보다 아래에 배치 -->
    <link rel="stylesheet" href="../static/css/sidebar.css?v=3">
</head>

<body>
    <div class="app-container">
        <!-- 사이드바가 동적으로 들어갈 위치 -->
        <div id="sidebar-container">
            {% include 'sidebar.html' %}
        </div>

        <!-- 우측 메인 콘텐츠 -->
        <main class="main-content">
            <div class="content-header">
                <h1 id="contentTitle">현재 상태: 수거 모드</h1>

                <span
                    id="modeBadge"
                    class="badge badge-collect"
                >
                    수거 가동 중
                </span>
            </div>

            <div class="content-body" id="contentBody">
                <h2>실시간 모니터링 (ELEV-01)</h2>

                <div
                    class="video-container"
                    id="videoContainer"
                >
                    <button
                        id="fullscreenBtn"
                        class="fullscreen-btn"
                        title="전체화면 토글"
                        type="button"
                    >
                        <i class="fa-solid fa-expand"></i>
                    </button>

                    <div class="video-placeholder">
                        <img
                            src="../static/images/video_placeholder.jpg"
                            alt="실시간 CCTV 화면"
                        >
                    </div>
                </div>

                <div class="control-panel">
                    <button
                        id="testAlertBtn"
                        class="test-btn"
                        type="button"
                    >
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        오배출 경고 테스트 (5초)
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- sidebar.js를 페이지 전용 main.js보다 먼저 불러옵니다. -->
    <script src="../static/js/sidebar.js"></script>
    <script src="../static/js/index.js"></script>
</body>

</html>
