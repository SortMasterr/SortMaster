# CCTV 프레임 추출부터 Qwen-VL 검수, YOLO 재학습과 모델 승격까지의 설정입니다.
paths:
  videos: autoTraining/inputVideos
  workspace: autoTraining/workspace
  # Build가 만든 배치별 학습 데이터셋의 영속 저장소입니다.
  datasetStore: autoTraining/datasets
  # 사람 검수로 고정한 평가셋이며 일일 학습 데이터와 자동 병합하지 않습니다.
  goldenTest: autoTraining/goldenTest
  bootstrapModel: autoTraining/models/bootstrap/best.pt
  modelRegistry: autoTraining/models/registry
  candidateModels: autoTraining/models/candidates
  activeModelPointer: autoTraining/models/current.json

trainingDatasetStore:
  # 이벤트 영상과 분리한 학습 데이터 원본 저장소입니다.
  samplesCollection: trainingSamples
  imagesBucket: trainingImages

eventStore:
  # 운영은 gridFs, 로컬 영상으로 개발할 때만 localDirectory를 사용합니다.
  source: gridFs
  # batchId 날짜 경계를 한국 시간 기준으로 계산합니다.
  utcOffsetHours: 9
  serverSelectionTimeoutMs: 5000
frames:
  # 1이면 모든 프레임을 저장하며 값이 커질수록 디스크 사용량과 처리량이 감소합니다.
  saveEveryN: 1
  jpegQuality: 95
  # 아래 기준은 원본 삭제가 아니라 자동 라벨링 후보 선별에만 사용합니다.
  candidateEveryN: 3
  minLaplacianVariance: 20.0
  minBrightness: 20.0
  maxBrightness: 235.0

inference:
  # rgb는 현재 프레임, causal은 t-2/t-1/t를 B/G/R 채널로 결합합니다.
  inputMode: causal
  imgsz: 416
  confidence: 0.20
  device: 0

qwenVl:
  # 포트는 .env의 LLM_PORT를 사용하며 여기에는 호스트만 기록합니다.
  apiHost: http://127.0.0.1
  # auto이면 설치 모델 중 이름에 qwen과 vl이 포함된 첫 모델을 선택합니다.
  model: auto
  timeoutSeconds: 180
  retries: 2
  minimumReviewConfidence: 0.70
  # 검수 스키마 응답은 원래 한 줄짜리 JSON이면 충분한데, 이 한도가 없으면 모델이 멈추지
  # 못하고 max_model_len까지 계속 생성하다 문자열이 잘려 JSON 파싱이 실패하는 문제가
  # 실제로 발생했다(2026-08-26 GPU 서버 실제 이미지 검증 중 확인). 짧게 강제로 끊어
  # 빨리 실패하고 재시도하도록 상한을 둔다.
  maxResponseTokens: 300

dataset:
  trainRatio: 0.80
  valRatio: 0.10
  testRatio: 0.10
  # autoTraining/models/bootstrap/best.pt(Label/Train 두 단계가 공용으로 쓰는 고정
  # 기준 모델)가 실제로 내놓는 클래스명 그대로(2026-08-26 model.names 직접 대조 확인).
  # 현재 운영 bestTop.pt와 bootstrap best.pt가 모두 내놓는 PascalCase 표기입니다.
  # 코드 일관성을 이유로 임의로 고치지 말고 실제 체크포인트의 model.names와 정확히
  # 일치시켜야 합니다. tracking2.py의 EXPECTED_CLASS_NAMES/TRASH_CLASSES/TRASH_TYPE_MAP 키도
  # 같은 값이며, TRASH_TYPE_MAP의 출력만 기존 lowercase API 계약을 유지합니다.
  classes:
    - TrashNormal
    - TrashPaper
    - TrashRecyclables
    - TrashCoffeecup

training:
  epochs: 100
  imgsz: 640
  batch: -1
  workers: 4
  device: 0
  amp: true
  patience: 30

promotion:
  # 고정 Golden Test에서 기존 모델보다 실제로 좋아져야 승격합니다.
  minimumMap50Gain: 0.001
  minimumRecallGain: 0.0

deployment:
  # tracking2.py가 기본으로 읽는 운영 파일명. Promote와 Deploy는 의도적으로 분리합니다.
  targetModel: WebApps/backend/models/trashdetect/bestTop.pt
